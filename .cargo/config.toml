# Entorno de build de rdd en esta máquina.
#
# Rust usa el toolchain `x86_64-pc-windows-gnu`, que enlaza con el MinGW-w64
# standalone instalado en C:\mingw64. Su `bin` no está en el PATH del sistema.
#
# `rustc-wrapper` antepone ese `bin` al PATH dentro del proceso de rustc, así
# que rustc, gcc, ld, dlltool y as se encuentran entre sí. Es un ejecutable
# porque la línea de comandos de `windows-sys` supera el límite de `cmd.exe`
# para los `.bat`. Fuente y motivo: `scripts/rustc-gnu.rs`.
#
# `[env] PATH` no sirve: cargo no lo propaga a rustc. `-C dlltool=...` tampoco:
# rustc no lo usa en el camino de las librerías raw-dylib.
[build]
target = "x86_64-pc-windows-gnu"
rustc-wrapper = "scripts/rustc-gnu.exe"
