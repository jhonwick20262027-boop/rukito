name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag ya publicado a reconstruir (p. ej. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: binario (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          # macos-latest es arm64 y su pool no asigna runners; ambos targets de
          # macOS se compilan en el runner Intel (el de arm64, cross-compilado).
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Enlazador de aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Objetivo mínimo de macOS
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Compilar
        shell: bash
        run: cargo build --release --locked -p rdd-cli --target "${{ matrix.target }}"

      - name: Empaquetar (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="rdd-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp LICENSE "dist/$name/LICENSE"
          cp "target/${{ matrix.target }}/release/rdd" "dist/$name/rdd"
          chmod 0755 "dist/$name/rdd"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"

      - name: Empaquetar (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $name = "rdd-$version-${{ matrix.target }}"
          $staging = "dist/$name"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item LICENSE "$staging/LICENSE"
          Copy-Item "target/${{ matrix.target }}/release/rdd.exe" "$staging/rdd.exe"
          Compress-Archive -Path $staging -DestinationPath "$staging.zip" -CompressionLevel Optimal
          Remove-Item -Recurse -Force $staging

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publicar release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # `rdd-*` no coincide con SHA256SUMS.txt, así que el archivo no se
          # incluye a sí mismo aunque el shell lo cree antes de la expansión.
          for f in rdd-*; do sha256sum "$f"; done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Crear la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "rdd ${TAG#v}" \
            --generate-notes
