[package]
name        = "rdd-cors"
description = "CORS propio del framework sobre el trait Middleware del núcleo, sin Tower ni plataforma (§11.5, ADR-13)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# RA-011/RF-095: entre los crates del framework, solo el núcleo. `http` y `bytes`
# son los tipos neutros de §4.3; el resto lo justifica §4.2 (leer [cors] de
# rdd.toml exige un parser de TOML, y RF-091 exige tracing).
rdd-core.workspace = true
bytes.workspace = true
http.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio.workspace = true