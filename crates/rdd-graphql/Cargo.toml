[package]
name        = "rdd-graphql"
description = "Motor GraphQL propio: esquema, validación, ejecución, introspección, SSE y explorer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# RA-021: el motor no depende de ninguna plataforma ni de WebSocket.
rdd-core.workspace = true
anyhow.workspace = true
bytes.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
# Escalar `ID` (RF-235): el tipo del agregado se publica como cadena.
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
