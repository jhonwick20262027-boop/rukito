<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rdd · GraphQL</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #6ea8fe;
    --ok: #4ade80;
    --error: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header span { color: var(--muted); font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr);
    gap: 16px;
    padding: 16px 24px 24px;
    align-items: start;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  textarea, input {
    width: 100%;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    resize: vertical;
  }
  textarea:focus, input:focus {
    outline: none;
    border-color: var(--accent);
  }
  #query { min-height: 260px; }
  #variables { min-height: 90px; }
  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  button {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 16px;
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
    min-height: 18px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.error { background: var(--error); }
  #output {
    margin: 0;
    min-height: 320px;
    max-height: 70vh;
    overflow: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>rdd GraphQL</h1>
  <span>consulta, mutación y suscripción por HTTP</span>
</header>
<main>
  <section>
    <label for="query">Operación</label>
    <textarea id="query" spellcheck="false">query {
  __typename
}</textarea>

    <label for="variables">Variables (JSON)</label>
    <textarea id="variables" spellcheck="false">{}</textarea>

    <label for="auth">Authorization</label>
    <input id="auth" type="text" spellcheck="false" placeholder="Bearer …">

    <div class="buttons">
      <button id="run" class="primary" type="button">Ejecutar</button>
      <button id="listen" type="button">Suscribirse</button>
      <button id="stop" type="button" disabled>Detener</button>
    </div>
    <p class="hint">Ejecutar usa POST JSON. Suscribirse usa POST con <code>Accept: text/event-stream</code> y lee el cuerpo con <code>fetch</code>.</p>
  </section>

  <section>
    <div class="status"><span id="dot" class="dot"></span><span id="status">listo</span></div>
    <pre id="output"></pre>
  </section>
</main>
<script>
(function () {
  "use strict";

  var queryEl = document.getElementById("query");
  var variablesEl = document.getElementById("variables");
  var authEl = document.getElementById("auth");
  var runEl = document.getElementById("run");
  var listenEl = document.getElementById("listen");
  var stopEl = document.getElementById("stop");
  var outputEl = document.getElementById("output");
  var statusEl = document.getElementById("status");
  var dotEl = document.getElementById("dot");

  var controller = null;
  var lines = 0;

  function setStatus(text, tone) {
    statusEl.textContent = text;
    dotEl.className = "dot" + (tone ? " " + tone : "");
  }

  function clearOutput() {
    outputEl.textContent = "";
    lines = 0;
  }

  function append(text) {
    if (lines > 0) {
      outputEl.textContent += "\n";
    }
    outputEl.textContent += text;
    lines += 1;
    outputEl.scrollTop = outputEl.scrollHeight;
  }

  function pretty(text) {
    try {
      return JSON.stringify(JSON.parse(text), null, 2);
    } catch (_) {
      return text;
    }
  }

  function readVariables() {
    var raw = variablesEl.value.trim();
    if (raw === "") {
      return null;
    }
    try {
      return JSON.parse(raw);
    } catch (_) {
      throw new Error("las variables no son JSON válido");
    }
  }

  function headers(accept) {
    var map = { "Content-Type": "application/json", "Accept": accept };
    var auth = authEl.value.trim();
    if (auth !== "") {
      map["Authorization"] = auth;
    }
    return map;
  }

  function payload() {
    var variables = readVariables();
    var body = { query: queryEl.value };
    if (variables !== null) {
      body.variables = variables;
    }
    return JSON.stringify(body);
  }

  function end() {
    if (controller) {
      controller.abort();
      controller = null;
    }
    runEl.disabled = false;
    listenEl.disabled = false;
    stopEl.disabled = true;
  }

  runEl.addEventListener("click", async function () {
    clearOutput();
    setStatus("ejecutando…");
    runEl.disabled = true;
    listenEl.disabled = true;
    stopEl.disabled = true;
    try {
      var response = await fetch(location.pathname, {
        method: "POST",
        headers: headers("application/json"),
        body: payload()
      });
      var text = await response.text();
      append("HTTP " + response.status + " · " + (response.headers.get("content-type") || "sin tipo"));
      append(pretty(text));
      setStatus(response.ok ? "respuesta recibida" : "error de transporte", response.ok ? "ok" : "error");
    } catch (err) {
      append("Error: " + (err && err.message ? err.message : String(err)));
      setStatus("sin respuesta", "error");
    } finally {
      runEl.disabled = false;
      listenEl.disabled = false;
    }
  });

  listenEl.addEventListener("click", async function () {
    clearOutput();
    setStatus("conectando…");
    runEl.disabled = true;
    listenEl.disabled = true;
    stopEl.disabled = false;
    controller = new AbortController();
    try {
      var response = await fetch(location.pathname, {
        method: "POST",
        headers: headers("text/event-stream"),
        body: payload(),
        signal: controller.signal
      });
      if (!response.ok || !response.body) {
        append("HTTP " + response.status + " · " + pretty(await response.text()));
        setStatus("la suscripción fue rechazada", "error");
        end();
        return;
      }
      setStatus("recibiendo eventos", "ok");
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";
      while (true) {
        var chunk = await reader.read();
        if (chunk.done) {
          break;
        }
        buffer += decoder.decode(chunk.value, { stream: true });
        var boundary = buffer.indexOf("\n\n");
        while (boundary !== -1) {
          var frame = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          handleFrame(frame);
          boundary = buffer.indexOf("\n\n");
        }
      }
      setStatus("flujo completado", "ok");
    } catch (err) {
      if (err && err.name === "AbortError") {
        setStatus("suscripción detenida");
      } else {
        append("Error: " + (err && err.message ? err.message : String(err)));
        setStatus("flujo interrumpido", "error");
      }
    } finally {
      end();
    }
  });

  function handleFrame(frame) {
    var event = "message";
    var data = [];
    frame.split("\n").forEach(function (line) {
      if (line.indexOf(":") === 0) {
        return;
      }
      if (line.indexOf("event:") === 0) {
        event = line.slice(6).trim();
      } else if (line.indexOf("data:") === 0) {
        data.push(line.slice(5).replace(/^ /, ""));
      }
    });
    if (event === "next") {
      append(pretty(data.join("\n")));
    } else if (event === "complete") {
      append("[complete]");
    }
  }

  stopEl.addEventListener("click", function () {
    if (controller) {
      controller.abort();
    }
    setStatus("suscripción detenida");
    end();
  });
})();
</script>
</body>
</html>
