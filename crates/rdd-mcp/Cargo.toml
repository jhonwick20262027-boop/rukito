[package]
name        = "rdd-mcp"
description = "Servidor MCP por stdio: JSON-RPC 2.0, tools tipadas y notificaciones de progreso."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# RA-018: el protocolo y el transporte solo hablan con el núcleo.
rdd-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# `io-util` da `BufReader`/`fill_buf`; `rt` trae `CancellationToken` (§10.6, RF-212).
tokio      = { workspace = true, features = ["io-util", "io-std", "sync", "rt", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
