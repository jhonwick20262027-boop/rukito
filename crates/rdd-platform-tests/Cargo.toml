[package]
name        = "rdd-platform-tests"
description = "Suite de conformidad de plataformas §4.5: los mismos casos contra Axum, hyper y dispatch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rdd-core.workspace = true

# Cliente HTTP de pruebas: `hyper` se usa SOLO como cliente, nunca como
# plataforma (`rdd-hyper` no entra en este árbol, RA-012).
bytes.workspace = true
futures.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
# C-13 a C-16 (§4.5): la plataforma con transporte y el cliente WebSocket viven
# aquí, como dev-dependencies; el resto de la suite sigue sin verlos.
rdd-axum = { workspace = true, features = ["ws"] }
tokio-tungstenite.workspace = true
# V17 (§22): la medición del hub también es una dev-dependency, para que la
# suite de conformidad no arrastre el tiempo real fuera de sus pruebas.
rdd-socket.workspace = true
