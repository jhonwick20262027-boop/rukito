[package]
name        = "rdd"
description = "Fachada del framework: re-exporta rdd-core y las macros, y elige la plataforma por feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# RA-013: el usuario depende de este crate, nunca de rdd-core a secas, porque lo
# que generan las macros son rutas absolutas ::rdd::...
rdd-core.workspace = true
rdd-macros.workspace = true

# Lo que necesita #[rdd::main] (§8.4), re-exportado para que el proyecto del
# usuario no declare dependencias de infraestructura.
dotenvy.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# La plataforma por defecto: `rdd-axum` (RP-012). Es `optional` para poder
# compilar la fachada sin ella y verificar que `run()` desaparece.
rdd-axum = { workspace = true, optional = true }
# Un crate opcional por motor (§12.6): la feature trae el adaptador y `run_main`
# lo registra. `sqlite` va por defecto; el resto lo activa `rdd new --database`.
rdd-sqlite = { workspace = true, optional = true }
rdd-postgres = { workspace = true, optional = true }
# Hub de salas y presencia (§10.5). No necesita registro: la feature solo lo trae
# y lo re-exporta.
rdd-socket = { workspace = true, optional = true }
# Servidor MCP por stdio (§10.6). Tampoco necesita registro.
rdd-mcp = { workspace = true, optional = true }
# Motor GraphQL (§10.9). El montaje lo aporta `AxumPlatform::graphql`.
rdd-graphql = { workspace = true, optional = true }
# Documentación OpenAPI 3.1 (§10.10). El montaje lo aporta
# `AxumPlatform::openapi`.
rdd-openapi = { workspace = true, optional = true }
# Lo que genera la macro GraphQL habla JSON; se re-exporta para que el proyecto
# del usuario no tenga que declararlo (RN-012).
serde_json.workspace = true

[features]
default = ["axum", "sqlite"]
# Activar `axum` hace dos cosas: trae la plataforma y le dice al núcleo que
# existe una plataforma por defecto, que es lo que habilita `App::run` (RP-012).
axum     = ["dep:rdd-axum", "rdd-core/default-platform"]
sqlite   = ["dep:rdd-sqlite"]
postgres = ["dep:rdd-postgres"]
# §12.6: el hub y el transporte WS son opcionales. `rdd-axum/ws` habilita la
# plataforma si aún no lo estaba; el puerto `.socket` vive en el núcleo y existe
# con o sin esta feature.
socket   = ["dep:rdd-socket", "rdd-axum/ws"]
# §12.6: MCP es opcional; trae el crate y no registra nada en `run_main`.
mcp      = ["dep:rdd-mcp"]
# §10.8, RA-020: el montaje `/mcp` vive en `rdd-axum` y la dependencia va en una
# sola dirección. Activar `mcp-http` sin `axum` deja el montaje en el crate de la
# plataforma, que es donde se usa.
mcp-http = ["mcp", "rdd-axum/mcp-http"]
# §10.9, RF-243: el motor y las macros. El montaje `/graphql` requiere `axum`;
# sin esa feature el crate emite un `compile_error!` claro (RP-012).
graphql  = ["dep:rdd-graphql", "rdd-axum/graphql"]
# §10.10, RF-245: la documentación OpenAPI y su montaje `/api-docs`. Requiere
# `axum`, igual que GraphQL.
openapi  = ["dep:rdd-openapi", "rdd-axum/openapi"]

[dev-dependencies]
bytes.workspace = true
http.workspace = true
# La suite G habla HTTP/1.1 de verdad contra `AxumPlatform` (§20).
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
trybuild.workspace = true
uuid.workspace = true
