# ≈ package.json + tsconfig.json (§5). El MSRV lo fija `rust-version`;
# `rust-toolchain.toml` solo declara el perfil.
#
# Este proyecto es miembro del workspace (RF-193), así que hereda versiones y
# lints. Un `rdd new` fuera del workspace genera el mismo archivo con versiones
# explícitas y la ruta a `rdd` que se le pasó por `--rdd-path`.
[package]
name = "todo-app"
description = "Demo de §26: TODO con JWT, roles, CORS y rate limit sobre SQLite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# RA-013: el proyecto depende de la fachada, nunca de `rdd-core`.
# La feature `socket` trae el hub de §10.5 y el transporte WS de `rdd-axum`; `mcp`
# trae el servidor MCP por stdio de §10.6, `mcp-http` el montaje `/mcp` de §10.8 y
# `graphql` el motor y el montaje `/graphql` de §10.9 y `openapi` la
# documentación servida en `/api-docs` de §10.10.
rdd = { workspace = true, features = ["socket", "mcp", "mcp-http", "graphql", "openapi"] }
# Paquete externo que lee su propia sección de `rdd.toml` (§11.5, RF-151).
rdd-cors.workspace = true
# `Error::internal` recibe un `anyhow::Error`; lo usan los adaptadores (§10.3).
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# El id del agregado es un UUID (§7.2); `serde` lo serializa como texto.
uuid.workspace = true
# Autenticación a nivel de aplicación, no del framework (§2.2, §26.3).
argon2.workspace = true
# Solo habilita `rand_core/getrandom` para que `argon2` pueda generar la sal.
password-hash.workspace = true
jsonwebtoken.workspace = true
# El middleware avisa de un token inválido sin rechazar la petición (§26.3).
tracing.workspace = true
# `tokio::select!` en el handler del canal: escucha al cliente y a la sala a la
# vez (§10.4).
tokio.workspace = true

[dev-dependencies]
bytes.workspace = true
futures.workspace = true
http.workspace = true
# Cliente HTTP de M-16 contra el binario `--mcp-http`.
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true